services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ebook-db
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-123}
      POSTGRES_DB: ${DB_NAME:-nest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ebook-network
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nest}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: ebook-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - ebook-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebook-api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASS:-123}@db:5432/${DB_NAME:-nest}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      TAVILY_API_KEY: ${TAVILY_API_KEY:?TAVILY_API_KEY is required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy_for_demo_boot_only}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME:?CLOUDINARY_NAME is required}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY is required}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ebook-network
    restart: unless-stopped

  ai-agent-python:
    build:
      context: ./ai-agent-python-v2
      dockerfile: Dockerfile
    container_name: ebook-ai-agent-python
    expose:
      - '8001'
    ports:
      - '8001:8001'
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      TAVILY_API_KEY: ${TAVILY_API_KEY:?TAVILY_API_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FRONTEND_URL: http://localhost:3001
      LANGGRAPH_FAST_API: ${LANGGRAPH_FAST_API:-false}
      NESTJS_BASE_URL: http://api:3000
      PORT: 8001
    depends_on:
      api:
        condition: service_started
    networks:
      - ebook-network
    restart: unless-stopped

  dashboard:
    build:
      context: ../Dashboard/my-app
      dockerfile: Dockerfile
    container_name: ebook-dashboard
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      NESTJS_API_URL: http://api:3000
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?SESSION_SECRET_KEY is required}
      PYTHON_AGENT_URL: http://ai-agent-python:8001/book-agent
      ALLOWED_ORIGIN: http://localhost:3001
    depends_on:
      api:
        condition: service_started
      ai-agent-python:
        condition: service_started
    networks:
      - ebook-network
    restart: unless-stopped

networks:
  ebook-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
